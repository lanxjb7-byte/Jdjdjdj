<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lixxzy Lite</title>
    <style>
        body {
            background: #0a0a0a; color: #fff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 100vh; margin: 0; background-image: radial-gradient(circle, #1a0005 0%, #050505 100%);
        }
        h1 { color: #ff0033; text-shadow: 0 0 15px #ff0033; margin-bottom: 10px; font-size: 32px; letter-spacing: 2px;}
        .subtitle { color: #888; font-size: 12px; margin-bottom: 40px; letter-spacing: 1px;}
        
        .switch { position: relative; display: inline-block; width: 70px; height: 40px; margin-bottom: 15px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
            background-color: #333; transition: .4s; border-radius: 40px; border: 2px solid #555;
        }
        .slider:before {
            position: absolute; content: ""; height: 30px; width: 30px;
            left: 4px; bottom: 3px; background-color: #888; transition: .4s; border-radius: 50%;
        }
        input:checked + .slider { background-color: #00ffcc; border-color: #00ffcc; box-shadow: 0 0 15px #00ffcc; }
        input:checked + .slider:before { transform: translateX(30px); background-color: #000; }

        .status { font-size: 14px; font-weight: bold; margin-bottom: 40px; color: #ff0033; text-shadow: 0 0 5px #ff0033;}

        .btn {
            background: #111; color: #fff; border: 2px solid #ff0033;
            padding: 18px 20px; font-size: 18px; font-weight: bold;
            margin: 10px; border-radius: 10px; cursor: pointer; width: 280px;
            transition: 0.3s; text-transform: uppercase; letter-spacing: 1px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .btn:hover { background: #ff0033; box-shadow: 0 0 20px #ff0033; }
        .btn:active { transform: scale(0.95); }
    </style>
</head>
<body>

    <h1>Lixxzy LITE</h1>
    <div class="subtitle">by Lixxzy Mods</div>

    <label class="switch">
        <input type="checkbox" id="toggleMod" onchange="toggleMod()">
        <span class="slider"></span>
    </label>
    <div class="status" id="statusText">STATUS: OFF</div>

    <button class="btn" onclick="startInject('FreeFire TH')">START FREEFIRETH</button>
    <button class="btn" onclick="startInject('FreeFire MAX')">START FREEFIREMAX</button>

    <script>
        let isModActive = false;

        function toggleMod() {
            isModActive = document.getElementById('toggleMod').checked;
            const status = document.getElementById('statusText');
            
            if (isModActive) {
                status.innerText = "STATUS: ON (Siap Inject)";
                status.style.color = "#00ffcc";
                status.style.textShadow = "0 0 5px #00ffcc";
            } else {
                status.innerText = "STATUS: OFF (File Dihapus)";
                status.style.color = "#ff0033";
                status.style.textShadow = "0 0 5px #ff0033";
                Android.removeFiles(); 
            }
        }

        function startInject(mode) {
            if (!isModActive) {
                alert("Aktifkan Toggle ON terlebih dahulu!");
                return;
            }
            Android.injectFiles(mode);
        }
    </script>
</body>
</html>
